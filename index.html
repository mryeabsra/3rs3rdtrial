
<!DOCTYPE html>
<html>
<head>
    <title>My Student Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        .profile {
            background: white;
            padding: 25px;
            max-width: 400px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 4px 10px gray;
        }

        h1 {
            color: #2471a3;
        }

        p {
            color: #444;
            font-size: 18px;
        }

        button {
            background: #2471a3;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #154360;
        }
    </style>
</head>

<body>

    <div class="profile">
        <h1>My Profile</h1>

        <h2>Welcome!</h2>

        <p><b>Name:</b> Your Name</p>
        <p><b>Department:</b> Computer Science</p>
        <p><b>University:</b> My University</p>
        <p><b>Hobby:</b> Coding</p>

        <button onclick="alert('Hello! Welcome to my website!')">
            Click Me
        </button>
    </div>

</body>
</html>
